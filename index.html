<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Consolidation — brain simulator</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <aside id="hud">
      <h1>Memory consolidation</h1>
      <p id="phase-label">Ready</p>
      <p id="caption"></p>

      <div id="buttons">
        <button id="btn-encode">1 · Experience</button>
        <button id="btn-sleep">2 · Sleep</button>
        <button id="btn-recall">3 · Recall</button>
        <button id="btn-demo" class="primary">Run all three</button>
        <button id="btn-reset">Reset</button>
      </div>

      <div class="meter">
        <label>Hippocampal dependence <output id="val-hip">0%</output></label>
        <div class="bar"><i id="bar-hip" class="hip"></i></div>
      </div>
      <div class="meter">
        <label>Direct cortical links <output id="val-ctx">0%</output></label>
        <div class="bar"><i id="bar-ctx" class="ctx"></i></div>
      </div>

      <div id="chips"></div>
      <p id="recall-text">No recall test yet.</p>

      <div id="options">
        <label>Speed <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1" /></label>
        <label><input id="audio" type="checkbox" /> Sound</label>
        <label><input id="silence" type="checkbox" checked /> Silence hippocampus during recall</label>
        <label><input id="rotate" type="checkbox" checked /> Auto-rotate</label>
      </div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
